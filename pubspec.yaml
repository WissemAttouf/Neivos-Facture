name: neivos_facture
description: Application de scan de factures avec OCR NEIVOS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Dépendances de base
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.5.3
  intl: ^0.19.0
  image: ^4.1.3   # <-- AJOUTEZ CETTE LIGNE POUR LE TRAITEMENT D'IMAGE

  # Gestion des fichiers et images
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # Interface utilisateur
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Utilitaires
  url_launcher: ^6.3.1

  # Export et partage de fichiers
  excel: ^4.0.6
  csv: ^6.0.0
  share_plus: ^10.1.4
  open_file: ^3.5.10

  # PDF (optionnel)
  pdf: ^3.11.3
  printing: ^5.14.2
  # Pour les graphiques
  fl_chart: ^0.68.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  http_parser: ^4.0.2
  mime: ^1.0.5
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/